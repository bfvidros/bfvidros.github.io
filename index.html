<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="description" content="B.F Vidros: vidro temperado, box, portas, janelas, guarda-corpos, espelhos e coberturas sob medida em Curitiba e Região Metropolitana.">
<title>B.F Vidros · Site</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Doto:wght@700;900&display=swap">
<style>
/* Site público B.F Vidros — tema único claro (pedido da B.F: site branco). Cores definidas explicitamente. */
:root{
  --bg:#ffffff; --surface:#f4f5f7; --fg:#0b0e14; --muted:#4a5260; --line:rgba(11,14,20,.14); --line2:#dadde3;
  --accent:#2f6fe0; --ink:#07080a;
  --f-display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --f-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --max:1320px; --gut:clamp(1.25rem,4vw,3.5rem); --sy:clamp(4.5rem,10vw,8.5rem);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-weight:450;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.sec{padding-block:var(--sy)}
.surf{background:var(--surface)}
.mono{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:12px}
.eyebrow b{font-weight:400;color:var(--accent)}
.eyebrow b::after{content:"";display:inline-block;width:28px;height:1px;background:currentColor;margin-left:12px;vertical-align:middle}
h1,h2,h3{font-family:var(--f-display);font-weight:300;margin:0;text-wrap:balance;letter-spacing:-.01em}
.h2{font-size:clamp(2rem,4.2vw,3.5rem);line-height:1.05}
h2 em,h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:clamp(1.15rem,1.05rem + .45vw,1.35rem);line-height:1.6;color:var(--muted);max-width:52ch;margin:0}
.head{display:flex;flex-direction:column;gap:16px;max-width:46rem}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 28px;border-radius:3px;border:1px solid var(--fg);background:var(--fg);color:#fff;text-decoration:none;font-family:var(--f-display);font-size:1rem;letter-spacing:.04em;cursor:pointer;transition:background .16s,border-color .16s,color .16s}
.btn:hover{background:#262b35}
.btn.ghost{background:transparent;color:var(--fg);border-color:rgba(11,14,20,.3)}
.btn.ghost:hover{border-color:var(--fg);background:var(--surface)}
.btn.sm{height:44px;padding:0 20px;font-size:.9375rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.ico{width:1.15em;height:1.15em;flex:none}
.tlink{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:4px}
/* topo */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{height:76px;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img:first-child{height:42px;width:auto}
.brand img:last-child{height:13px;width:auto}
.nav{display:flex;gap:32px;margin-left:24px}
.nav a{position:relative;font-family:var(--f-display);font-size:.8125rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 0}
.nav a:hover,.nav a.on{color:var(--fg)}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--accent)}
.acts{margin-left:auto;display:flex;align-items:center;gap:24px}
.soc{display:inline-flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font-size:.875rem;opacity:.85}
.soc:hover{opacity:1}
.burger{display:none;margin-left:auto;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;align-items:center;justify-content:center}
.menu{position:fixed;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column;padding:24px max(var(--gut),env(safe-area-inset-right,0px)) 32px max(var(--gut),env(safe-area-inset-left,0px))}
.menu .close{align-self:flex-end;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;font-size:20px}
.menu nav{display:flex;flex-direction:column;margin-top:24px}
.menu nav a{font-family:var(--f-display);font-weight:300;font-size:1.875rem;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line)}
.menu .msoc{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.menu .msoc a{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
/* hero */
.hero .in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(2rem,6vw,6rem);align-items:center;padding-block:clamp(2.5rem,6vw,5rem) clamp(3rem,7vw,6rem)}
.hero h1{font-size:clamp(2.5rem,5.4vw,5rem);line-height:1.02;max-width:15ch}
.hero .txt{display:flex;flex-direction:column;gap:24px;min-width:0}
.ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.show{position:relative;aspect-ratio:4/5;max-height:78vh;overflow:hidden;background:var(--surface)}
.show img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.05);transition:opacity 1.4s ease,transform 9s linear}
.show img.on{opacity:1;transform:scale(1)}
.show .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,10,0) 62%,rgba(7,8,10,.55));pointer-events:none}
.show .meta{position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.show .cap{display:flex;gap:12px;align-items:baseline;background:rgba(7,8,10,.74);color:#fff;padding:10px 14px;text-decoration:none;font-size:.875rem;font-weight:500;max-width:34ch;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.show .cap span{font-family:var(--f-mono);font-size:.6875rem;color:#7fb2ff;flex:none}
.dots{display:flex;gap:6px}
.dots button{width:28px;height:24px;border:0;background:none;padding:0;cursor:pointer;position:relative}
.dots button::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.4)}
.dots button.on::before{background:#fff}
/* serviços (home) */
.svc{margin-top:64px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(2rem,6vw,6rem);align-items:start}
.svc ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.svc .row{width:100%;display:grid;grid-template-columns:3.5rem 1fr auto;align-items:baseline;gap:16px;padding:clamp(1.25rem,2.6vw,2rem) 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;color:var(--muted)}
.svc .row .c{font-family:var(--f-mono);font-size:.8125rem}
.svc .row .n{font-family:var(--f-display);font-weight:300;font-size:clamp(1.75rem,3.4vw,2.75rem);line-height:1.1}
.svc .row .k{font-family:var(--f-mono);font-size:.75rem}
.svc .row.on{color:var(--fg)} .svc .row.on .c{color:var(--accent)}
.svc .pan{position:sticky;top:100px;display:flex;flex-direction:column;gap:22px}
.svc .pan .m{aspect-ratio:4/3.2;overflow:hidden;background:var(--surface)}
.svc .pan .m img,.svc .pan .m svg{width:100%;height:100%;object-fit:cover}
.links{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;min-height:44px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500}
.links a span{color:var(--muted);transition:transform .16s,color .16s}
.links a:hover span{transform:translateX(3px);color:var(--accent)}
/* obras */
.rowhead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.mosaic{margin-top:64px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(1.25rem,2.4vw,2.25rem)}
.mosaic>:nth-child(1){grid-column:1/span 8}.mosaic>:nth-child(2){grid-column:9/span 4}
.mosaic>:nth-child(3){grid-column:1/span 4}.mosaic>:nth-child(4){grid-column:5/span 4}.mosaic>:nth-child(5){grid-column:9/span 4}
.card{display:flex;flex-direction:column;gap:14px;text-decoration:none;min-width:0}
.card .m{position:relative;overflow:hidden;background:var(--surface);aspect-ratio:4/5}
.card.wide .m{aspect-ratio:16/10}
.card .m img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card:hover .m img{transform:scale(1.035)}
.card .cp{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.card .cp small{font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card .cp b{font-family:var(--f-display);font-weight:400;font-size:1.1875rem;line-height:1.3}
.card .badge{position:absolute;left:12px;top:12px;font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(7,8,10,.7);padding:5px 8px}
/* detalhes */
.det{margin-top:64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1rem,2vw,1.75rem)}
.det a{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.det img{aspect-ratio:3/4;object-fit:cover;width:100%;transition:transform .9s}
.det a:hover img{transform:translateY(-3px)}
.det span{font-family:var(--f-display);font-size:1.125rem;border-top:1px solid var(--line);padding-top:12px}
/* razões / processo */
.reasons{list-style:none;padding:0;margin:64px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(1.5rem,3vw,3rem)}
.reasons li{border-top:1px solid var(--fg);padding-top:24px;display:flex;flex-direction:column;gap:12px}
.reasons .n{font-family:var(--f-mono);font-size:.8125rem;color:var(--accent)}
.reasons h3{font-weight:400;font-size:1.375rem}
.reasons p{margin:0;color:var(--muted)}
.steps{list-style:none;padding:0;margin:64px 0 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line)}
.steps li{position:relative;display:flex;flex-direction:column;gap:8px;padding:24px 16px 0 0}
.steps li::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--fg)}
.steps li:first-child::before{background:var(--accent)}
.steps .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.steps b{font-family:var(--f-display);font-weight:400;font-size:1.1875rem}
.steps span{color:var(--muted);font-size:.9375rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(2rem,6vw,6rem);align-items:center}
.split img{width:100%;aspect-ratio:4/3;object-fit:cover}
.big{font-family:var(--f-display);font-weight:300;font-size:clamp(2.25rem,5vw,4.25rem);line-height:1.02;margin:16px 0}
.clinks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.clinks a{display:flex;align-items:center;gap:24px;padding:28px 0;border-bottom:1px solid var(--line);text-decoration:none}
.clinks .ico{width:30px;height:30px;color:var(--accent)}
.clinks small{display:block;font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.clinks b{font-family:var(--f-display);font-weight:300;font-size:clamp(1.5rem,3vw,2.25rem);overflow-wrap:anywhere}
.clinks .ar{margin-left:auto;color:var(--muted);transition:transform .16s,color .16s}
.clinks a:hover .ar{transform:translateX(4px);color:var(--accent)}
/* cabeçalho interno */
.ph{border-bottom:1px solid var(--line)}
.ph .in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(2rem,6vw,6rem);align-items:center;padding-block:clamp(3rem,7vw,6rem) clamp(3rem,6vw,5rem)}
.ph .in.noimg{grid-template-columns:1fr}
.ph .t{display:flex;flex-direction:column;gap:22px;min-width:0}
.ph .t .eyebrow{color:var(--accent)}
.ph h1{font-size:clamp(2.25rem,5vw,4.25rem);line-height:1.04;max-width:18ch}
.ph img,.ph video.phv{width:100%;aspect-ratio:4/4.4;max-height:460px;object-fit:cover;display:block;background:#0d2a5c}
.jump{display:flex;flex-wrap:wrap;gap:8px 32px}
.jump a{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;border-bottom:1px solid var(--line)}
.jump a span{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.jump a:hover{border-color:var(--accent)}
/* serviços (página) */
.grp{padding-block:clamp(4rem,8vw,7rem) 0;scroll-margin-top:80px}
.grp:last-of-type{padding-bottom:clamp(4rem,8vw,7rem)}
.gh{display:grid;grid-template-columns:4rem minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:baseline;padding-bottom:32px;border-bottom:1px solid var(--fg)}
.gh .c{font-family:var(--f-mono);color:var(--accent)}
.gh h2{font-size:clamp(2rem,4vw,3.25rem);line-height:1.05}
.gh p{margin:0;color:var(--muted);max-width:44ch}
.sgrid{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:48px clamp(1.25rem,2.4vw,2.25rem)}
.sitem{display:flex;flex-direction:column;gap:8px;text-decoration:none}
.sitem .m{aspect-ratio:4/5;overflow:hidden;background:var(--surface);margin-bottom:10px}
.sitem .m img{width:100%;height:100%;object-fit:cover;transition:transform .9s}
.sitem:hover .m img{transform:scale(1.035)}
.sitem b{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.sitem span{color:var(--muted)}
.draw{position:relative;width:100%;height:100%;display:grid;place-items:center;background:var(--surface)}
.draw svg{width:86%;height:auto;max-width:520px}
.draw small{position:absolute;left:14px;bottom:12px;font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cta{background:var(--surface);padding-block:64px}
.cta .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px}
.cta p{margin:0;font-family:var(--f-display);font-weight:300;font-size:clamp(1.5rem,3vw,2.25rem);max-width:26ch}
/* serviço detalhe */
.crumbs{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin:32px 0}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--fg)}
.sd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(2rem,6vw,6rem);align-items:center;padding-bottom:var(--sy)}
.sd .m{aspect-ratio:4/4.6;overflow:hidden;background:var(--surface)}
.sd .m img{width:100%;height:100%;object-fit:cover}
.sd .t{display:flex;flex-direction:column;gap:24px}
.sd h1{font-size:clamp(2.5rem,5vw,4.25rem);line-height:1.02}
.hl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hl li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hl li::before{content:"✓";color:var(--accent);font-size:.875rem}
.note{font-size:.875rem;color:var(--muted);margin:0}
.rel{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));column-gap:32px;border-top:1px solid var(--line)}
.rel a{display:flex;flex-direction:column;gap:4px;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none}
.rel b{font-family:var(--f-display);font-weight:400;font-size:1.1875rem}
.rel a:hover b{color:var(--accent)}
.rel span{color:var(--muted)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1.25rem,2.4vw,2.25rem)}
.h3{font-size:clamp(1.75rem,3vw,2.5rem);margin-bottom:48px}
/* portfólio */
.fbar{position:sticky;top:76px;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.filters{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:none;height:56px;background:none;border:0;border-bottom:1px solid transparent;cursor:pointer;font-family:var(--f-display);font-size:.9375rem;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.filters button small{font-family:var(--f-mono);font-size:.6875rem}
.filters button.on{color:var(--fg);border-bottom-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:64px clamp(1.25rem,2.4vw,2.25rem);padding-block:48px var(--sy)}
.pgrid .wide{grid-column:span 2}
/* obra */
.ob{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(2rem,6vw,6rem);align-items:start;padding-block:clamp(2rem,5vw,4rem) var(--sy)}
.ob .main{width:100%;aspect-ratio:3/4;max-height:86vh;object-fit:cover;background:var(--surface)}
.thumbs{display:flex;gap:12px;margin-top:16px;overflow-x:auto}
.thumbs button{width:88px;height:110px;padding:0;border:2px solid transparent;background:none;cursor:pointer;opacity:.82;flex:none;transition:opacity .2s,border-color .2s}.thumbs button:hover{opacity:1}
.thumbs button.on{opacity:1;border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.ob aside{position:sticky;top:100px;display:flex;flex-direction:column;gap:24px}
.ob h1{font-size:clamp(2rem,3.6vw,3.25rem);line-height:1.06}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.875rem;min-height:44px}
.lbl{font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lst{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.lst li{padding:12px 0;border-bottom:1px solid var(--line)}
.lst a{text-decoration:none}.lst a:hover{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.pager{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pager a{display:flex;align-items:center;gap:24px;padding:32px var(--gut);text-decoration:none}
.pager a:hover{background:var(--surface)}
.pager img{width:96px;height:120px;object-fit:cover;flex:none}
.pager span{display:flex;flex-direction:column;gap:6px;font-family:var(--f-display);font-size:1.1875rem}
.pager .nx{flex-direction:row-reverse;text-align:right;border-left:1px solid var(--line)}
/* orçamento */
.q{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr);gap:clamp(2rem,6vw,6rem);padding-block:clamp(2.5rem,5vw,4rem) var(--sy);align-items:start}
.qsteps{display:flex;gap:8px;margin-bottom:40px}
.qsteps span{flex:1;height:2px;background:var(--line2)}
.qsteps span.on{background:var(--fg)}
.qh{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.q h2{font-size:clamp(1.75rem,3vw,2.5rem);margin-bottom:28px}
.chipgrp{margin-bottom:28px}
.chipgrp .lbl{margin-bottom:12px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:44px;padding:0 16px;border:1px solid var(--line2);background:#fff;border-radius:3px;cursor:pointer;font-size:.9375rem;transition:border-color .16s,background .16s}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.fields .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}
.fld label{font-size:.875rem;font-weight:500}
.fld input,.fld textarea{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line2);border-radius:3px;padding:12px 16px;min-height:48px;width:100%}
.fld textarea{min-height:120px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,224,.18)}
.fld .hint{font-size:.8125rem;color:var(--muted)}
.fld .err{font-size:.8125rem;color:#b3262e}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px;border:1px dashed rgba(11,14,20,.3);border-radius:3px;background:var(--surface);cursor:pointer;text-align:center;padding:24px}
.drop:hover{border-color:var(--fg)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:16px}
.pv div{position:relative;aspect-ratio:1;overflow:hidden;background:var(--surface)}
.pv img{width:100%;height:100%;object-fit:cover}
.pv button{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(7,8,10,.75);color:#fff;cursor:pointer}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.9375rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--fg)}
.sum{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sum li{display:grid;grid-template-columns:9rem 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.sum li span:first-child{color:var(--muted);font-size:.875rem}
.qside{position:sticky;top:100px;display:flex;flex-direction:column;gap:20px;padding:28px;background:var(--surface)}
.qside img{aspect-ratio:4/3;object-fit:cover;width:100%}
.done{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.demo{font-size:.8125rem;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
/* sobre */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(2rem,6vw,6rem);align-items:start}
.about p{margin:0 0 20px;font-size:1.0625rem;line-height:1.7;color:var(--muted);max-width:58ch}
.about p b{color:var(--fg);font-weight:500}
.photos2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.photos2 img{width:100%;aspect-ratio:3/4;object-fit:cover}
.photos2 img:nth-child(2){margin-top:64px}
.vals{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1.5rem,3vw,3rem)}
.vals li{border-top:1px solid var(--fg);padding-top:24px}
.vals b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.375rem;margin-bottom:10px}
.vals span{color:var(--muted)}
/* rodapé */
.foot{background:var(--surface);border-top:1px solid var(--line);padding-top:80px;color:var(--muted)}
.foot .in{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:48px}
.foot img{width:118px;height:auto}
.foot p{max-width:30ch;margin:24px 0 0}
.foot .col{display:flex;flex-direction:column;gap:12px}
.foot .col a{color:var(--fg);text-decoration:none;opacity:.86;display:inline-flex;align-items:center;gap:10px;min-height:28px}
.foot .col a:hover{opacity:1}
.foot .base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:64px;padding-block:24px 32px;border-top:1px solid var(--line);font-size:.8125rem}
.mbar{display:none}
.mbar[hidden]{display:none!important}
/* mapa real em azul */
.mreal{height:clamp(320px,36vw,460px)}
.mreal .mbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08) brightness(1.02)}
.mreal .mtint{position:absolute;inset:0;background:linear-gradient(135deg,rgba(31,95,216,.38),rgba(13,42,92,.30));mix-blend-mode:multiply;pointer-events:none}
.mreal::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(40% 55% at 49% 46%,rgba(61,139,255,.16),rgba(61,139,255,0) 70%)}
.mpin{position:absolute;z-index:2;transform:translate(-50%,-92%);display:flex;flex-direction:column;align-items:center}
.mpin svg{position:relative;z-index:2;filter:drop-shadow(0 8px 10px rgba(7,26,61,.45))}
.mpin .pr{position:absolute;left:50%;bottom:-6px;width:60px;height:60px;margin-left:-30px;border:2px solid #3d8bff;border-radius:50%;opacity:0;transform:scale(.4)}
@media (prefers-reduced-motion:no-preference){.mpin .pr{animation:radar2 3.6s ease-out infinite}.mpin .pr:nth-child(2){animation-delay:1.2s}.mpin .pr:nth-child(3){animation-delay:2.4s}}
@keyframes radar2{0%{transform:scale(.4);opacity:.9}100%{transform:scale(4.5);opacity:0}}
.mlab{position:absolute;left:30px;top:6px;z-index:3;white-space:nowrap;display:flex;flex-direction:column;background:#fff;padding:7px 11px 7px 12px;border-left:3px solid #3d8bff;border-radius:2px;box-shadow:0 10px 24px -12px rgba(7,26,61,.55)}
.mlab b{font-family:var(--f-display);font-weight:500;font-size:1rem;color:#0b0e14}
.mlab i{font-style:normal;font-family:var(--f-mono);font-size:.625rem;letter-spacing:.12em;text-transform:uppercase;color:#1f5fd8}
.mreal .mcard{z-index:4}
@media (max-width:600px){.mreal{height:auto}.mreal .mbg{position:relative;height:300px}.mreal .mtint,.mreal::after{height:300px;bottom:auto}.mpin{top:150px!important}}
/* cenas "Vidro em movimento" em fundo azul-marinho */
.scene svg{background:radial-gradient(90% 80% at 50% 25%,#16407f 0%,#0d2a5c 55%,#071a3d 100%)!important}
.scene::before{background:radial-gradient(60% 50% at 50% 30%,rgba(140,192,255,.18),rgba(7,26,61,0))!important;z-index:1}
.scene svg [stroke="#3d4552"]{stroke:#c4c9d1}
.scene svg [stroke="#8c929c"]{stroke:#6b7380}
.scene svg [fill="#0b0e14"]{fill:#e6ebf2}
.scene svg [fill="#3d4552"]{fill:#c4c9d1}
.scene svg [fill="#eef1f5"]{fill:rgba(255,255,255,.10);stroke:rgba(196,201,209,.6)}
.scene svg circle[fill="#fff"]{fill:#0d2a5c;stroke:#c4c9d1}
.scene svg [stroke="#2f6fe0"]{stroke:#8cc0ff}
.scene svg .an-rain,.scene svg .an-water{stroke:#8cc0ff;stroke-opacity:.9}
.scene svg .an-hint{stroke:#8cc0ff}
.scene svg rect[fill="url(#gA)"]{filter:drop-shadow(0 0 6px rgba(61,139,255,.35))}
/* vidro na frente da foto: reflexo de luz passando + borda lapidada */
.show .pane{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;
 background:linear-gradient(125deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 72%,rgba(140,192,255,.10) 100%);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 0 0 6px rgba(255,255,255,.06),inset 0 0 40px rgba(140,192,255,.12)}
.show .pane i{position:absolute;top:-30%;bottom:-30%;left:-70%;width:38%;transform:skewX(-20deg);
 background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.08) 25%,rgba(255,255,255,.55) 48%,rgba(220,235,255,.25) 56%,rgba(255,255,255,0));mix-blend-mode:screen}
@media (prefers-reduced-motion:no-preference){.show .pane i{animation:glassSweep 7.5s cubic-bezier(.45,0,.2,1) infinite}}
@keyframes glassSweep{0%,55%{left:-70%}100%{left:140%}}

.founder .ff::before{content:"";position:absolute;inset:-18px 18px 18px -18px;background:linear-gradient(135deg,rgba(61,139,255,.25),rgba(140,192,255,.05));clip-path:polygon(0 8%,100% 0,100% 100%,0 92%);z-index:0}
.founder img{position:relative;z-index:1;width:100%;aspect-ratio:3/4;object-fit:cover;box-shadow:0 30px 60px -34px rgba(11,14,20,.5)}
.founder figcaption{display:flex;flex-direction:column;gap:2px;margin-top:16px;padding-left:14px;border-left:2px solid #3d8bff}
.founder figcaption b{font-family:var(--f-display);font-weight:400;font-size:1.125rem}
.founder figcaption span{font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.atext{display:flex;flex-direction:column;gap:18px}
.atext p{margin:0;font-size:1.0625rem;line-height:1.7;color:var(--muted);max-width:56ch}
.atext p b{color:var(--fg);font-weight:600}
.mvv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1.5rem,3vw,3rem)}
.mvv>div{display:flex;flex-direction:column;align-items:flex-start;gap:14px;background:#fff;border:1px solid var(--line2);border-radius:4px;padding:28px;position:relative;overflow:hidden}
.mvv>div::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--glassg)}
.mvv h3{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0}
.mvv p{margin:0;color:var(--muted);line-height:1.65}
.mvv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.mvv li{display:flex;align-items:center;gap:10px;font-weight:500}
.mvv li::before{content:"";width:8px;height:11px;flex:none;background:var(--glassg);clip-path:polygon(0 18%,100% 0,100% 82%,0 100%)}
.glowb{background:var(--glassg);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
@media (max-width:900px){.aboutx,.mvv{grid-template-columns:1fr}.founder{max-width:420px}}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));flex-direction:row-reverse;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:10px;text-decoration:none}
.fabi{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 30%,#4ee38a,#25d366 45%,#128c4a);box-shadow:0 14px 28px -10px rgba(18,140,74,.7),inset 0 1px 0 rgba(255,255,255,.4),0 0 0 3px #fff}
.fabi .ico{width:30px;height:30px}
.fabi::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #25d366;opacity:0}
.fabt{font-family:var(--f-display);font-size:.875rem;letter-spacing:.03em;color:#fff;background:#0b0e14;padding:8px 12px;border-radius:3px;opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.fab:hover .fabt,.fab:focus-visible .fabt{opacity:1;transform:none}
.fab:hover .fabi{filter:brightness(1.06)}
@media (prefers-reduced-motion:no-preference){.fabi::after{animation:waPulse 2.8s ease-out infinite}}
@keyframes waPulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@media (max-width:860px){.fab{bottom:calc(9px + env(safe-area-inset-bottom,0px))}.fabi{width:52px;height:52px}.fabt{display:none}.mbar{grid-template-columns:1fr!important;padding-right:calc(max(12px,env(safe-area-inset-right,0px)) + 64px)!important}}
.mapa{position:relative;margin-top:48px;border-radius:6px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 30px 60px -40px rgba(11,14,20,.45);background:#eef2f7}
.mapa>svg{display:block;width:100%;height:clamp(320px,36vw,460px)}
.mapa .pulse circle{fill:none;stroke:#3d8bff;stroke-width:2;opacity:0;transform-origin:600px 215px;transform-box:view-box}
.mapa .orbit{transform-origin:600px 215px;transform-box:view-box}
@media (prefers-reduced-motion:no-preference){
 .mapa .pulse circle{animation:radar 3.6s ease-out infinite}.mapa .pulse circle:nth-child(2){animation-delay:1.2s}.mapa .pulse circle:nth-child(3){animation-delay:2.4s}
 .mapa .orbit{animation:spin 40s linear infinite}}

@keyframes spin{to{transform:rotate(360deg)}}
.mcard{position:absolute;left:16px;top:16px;background:#fff;border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:0 12px 30px -16px rgba(11,14,20,.4);max-width:300px;border-top:2px solid #3d8bff}
.mcard b{font-family:var(--f-display);font-weight:400;font-size:1.125rem}
.mcard span{font-size:.8125rem;color:var(--muted)}
.mact{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mnote{position:absolute;right:12px;bottom:10px;font-family:var(--f-mono);font-size:.625rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.8);padding:3px 6px}

.medal{display:block;flex:none;filter:drop-shadow(0 8px 14px rgba(7,26,61,.35))}
/* HUD de medição na foto */
.show .hud{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.hud .hc{fill:none;stroke:#fff;stroke-width:2.2;opacity:.9}
.hud .dim line{stroke:#8cc0ff;stroke-width:1.4;vector-effect:non-scaling-stroke}
.hud .dh line:first-child,.hud .dv line:first-child{stroke-dasharray:420;stroke-dashoffset:420}
.hud .scan{stroke:#8cc0ff;stroke-width:2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px #3d8bff);opacity:.85}
.readout{position:absolute;left:16px;top:16px;z-index:2;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;background:rgba(7,8,10,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:9px 12px;border-left:2px solid #3d8bff}
.readout i{width:7px;height:7px;border-radius:50%;background:#3d8bff;box-shadow:0 0 10px #3d8bff;grid-row:span 2}
.readout span{font-family:var(--f-mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;color:#8cc0ff}
.readout b{font-family:var(--f-display);font-weight:400;font-size:.875rem;color:#fff}
@media (prefers-reduced-motion:no-preference){
 .hud .dh line:first-child{animation:drawL 6.5s ease-in-out infinite}
 .hud .dv line:first-child{animation:drawL 6.5s ease-in-out infinite .5s}
 .hud .scan{animation:scan 4.2s ease-in-out infinite}
 .readout i{animation:blink 1.6s ease-in-out infinite}}
@keyframes drawL{0%{stroke-dashoffset:420}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes scan{0%{transform:translateY(20px);opacity:0}10%{opacity:.85}90%{opacity:.85}100%{transform:translateY(480px);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
/* destaques */
.hlsec{padding-bottom:0}.hlsec .hlrow{margin-top:40px}
.hlrow{display:flex;gap:clamp(14px,2.4vw,34px);overflow-x:auto;padding:18px 4px 22px;scrollbar-width:none;justify-content:space-between}
.hli{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;flex:none;min-width:84px}
.hli .ring{position:relative;padding:4px;border-radius:50%;display:block}
.hli .ring::before{content:"";position:absolute;inset:0;border-radius:50%;padding:2px;background:conic-gradient(from 0deg,#3d8bff,#c4c9d1,#ffffff,#1f5fd8,#8cc0ff,#3d8bff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.hli:hover .ring::before{filter:drop-shadow(0 0 8px rgba(61,139,255,.8))}
.hli .medal,.hli .hlimg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.hli .hlimg{display:block;width:76px;height:76px;border-radius:50%;object-fit:cover;box-shadow:0 8px 14px rgba(7,26,61,.35)}
.hli:hover .hlimg{transform:scale(1.06)}
.hli:hover .medal{transform:scale(1.06)}
.hlt{font-family:var(--f-display);font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);text-align:center;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.hli .ring::before{animation:spin 6s linear infinite}.hli:nth-child(even) .ring::before{animation-duration:8s;animation-direction:reverse}}
@keyframes spin{to{transform:rotate(360deg)}}

.svc .row .n{display:flex;align-items:center;gap:16px}
.fm{display:inline-flex;transition:transform .5s,filter .5s;opacity:.55}
.svc .row.lit .fm{opacity:1}
.svc .row.cur .fm{transform:scale(1.08) rotate(-4deg);filter:drop-shadow(0 0 16px rgba(61,139,255,.55))}
.ghm{display:flex;align-items:center;gap:18px}
.clinks a .medal{flex:none}
/* página Sobre: história em capítulos */

.chap{display:flex;flex-direction:column;gap:20px}
.big2{margin:0;font-family:var(--f-display);font-weight:300;font-size:clamp(1.6rem,2.8vw,2.4rem);line-height:1.2;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}

/* escudo 3D: arrastar para girar */
(()=>{let el=null,x0=0,ry0=0,ry=0;
 document.addEventListener("pointerdown",e=>{const t=e.target.closest&&e.target.closest(".escudo");if(!t)return;el=t.querySelector(".esc3d");if(!el)return;
  const m=getComputedStyle(el).transform,v=m.match(/matrix3d\(([^)]+)\)/);ry=v?Math.atan2(-+v[1].split(",")[2],+v[1].split(",")[0])*180/Math.PI:0;
  ry0=ry;x0=e.clientX;el.style.animation="none";el.style.transform="rotateY("+ry+"deg)";el.classList.add("girando");});
 document.addEventListener("pointermove",e=>{if(!el)return;ry=ry0+(e.clientX-x0)*.6;el.style.transform="rotateY("+ry.toFixed(1)+"deg)";});
 const solta=()=>{if(!el)return;const s=el;el=null;s.classList.remove("girando");s.style.transition="transform .9s cubic-bezier(.2,.8,.2,1)";s.style.transform="rotateY(0deg)";
  setTimeout(()=>{s.style.transition="";s.style.transform="";s.style.animation="";},950);};
 document.addEventListener("pointerup",solta);document.addEventListener("pointercancel",solta);})();
/* fim escudo 3D: arrastar */

/* fim antes e depois se mexe */
document.addEventListener("input",e=>{if(e.target.dataset.ba!==undefined)e.target.closest(".ba").style.setProperty("--x",e.target.value+"%");});
document.addEventListener("change",e=>{if(e.target.id==="fotos"){const files=[...e.target.files].slice(0,6-Q.fotos.length);
 let n=files.length; if(!n)return; files.forEach(f=>{const r=new FileReader();r.onload=()=>{Q.fotos.push(r.result);if(--n===0)render();};r.readAsDataURL(f);});}});
/* menu do celular */
const menu=document.getElementById("menu");
function closeMenu(){menu.hidden=true;document.body.style.overflow="";}
document.getElementById("burger").onclick=()=>{menu.className="menu";menu.innerHTML=`<button class="close" aria-label="Fechar menu">×</button><nav><a href="#inicio">Início</a>${NAV.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join("")}<a href="#orcamento">Solicitar orçamento</a></nav>
 <div class="msoc"><a href="${WA}" target="_blank" rel="noopener">${ICO.wa}${WA_TXT}</a><a href="${IG}" target="_blank" rel="noopener">${ICO.ig}${IG_TXT}</a></div>`;
 menu.hidden=false;document.body.style.overflow="hidden";menu.querySelector(".close").onclick=closeMenu;menu.querySelector(".close").focus();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!menu.hidden)closeMenu();});
/* abertura em fusão lenta */
let showT;
function restartShow(){clearInterval(showT);if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 showT=setInterval(()=>{const el=document.getElementById("show");if(!el)return;showI=(showI+1)%SLIDES.length;
  el.querySelectorAll("img").forEach((im,k)=>{im.classList.toggle("on",k===showI);im.alt=k===showI?SLIDES[k][1][1]:""});
  el.querySelectorAll(".dots button").forEach((b,k)=>b.classList.toggle("on",k===showI));
  const cap=document.getElementById("cap");cap.href="#obra-"+SLIDES[showI][0];cap.innerHTML=`<span>${pad(showI+1)} / ${pad(SLIDES.length)}</span>${esc(obById(SLIDES[showI][0]).t)} →`;},6500);}
chrome(); render(); restartShow();
</script>

</body>
</html>
